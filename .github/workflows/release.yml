name: Release

on:
  release:
    types: [published]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json;print(json.load(open('custom_components/wican_log_import/manifest.json'))['version'])")
          test "$tag" = "$version" || { echo "Tag $tag != manifest $version"; exit 1; }
